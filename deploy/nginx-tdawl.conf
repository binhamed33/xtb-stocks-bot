# Nginx site for the web dashboard (written by install-web.sh; __DOMAIN__ / __PORT__ substituted).
# This file is the ONLY nginx file the installer touches. HTTP serves the ACME challenge and
# either proxies (no certificate yet) or redirects to HTTPS; install-web.sh appends the TLS block.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        __HTTP_ACTION__
    }
}
